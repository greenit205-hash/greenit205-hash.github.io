<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jadłospis</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6E1E46">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EFEDE6; --surface:#FFFFFF; --ink:#16181A; --muted:#6B6F6A; --line:#DCD8CE;
  --berry:#6E1E46; --gold:#A87C00; --teal:#2E6F6A; --alert:#8C2F1B; --ok:#2E6F4A;
  --r:14px; --pad:16px;
  --display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
     padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--display);font-weight:800;letter-spacing:-.02em;margin:0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px}

header{position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(10px + env(safe-area-inset-top)) var(--pad) 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.hrow h1{font-size:20px}
.hsub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em}
.balance{margin-top:10px}
.bar{position:relative;height:26px;border-radius:6px;background:#E2DFD6;overflow:hidden;display:flex}
.bar span{display:block;height:100%}
.bar .p{background:var(--berry)} .bar .c{background:var(--gold)} .bar .f{background:var(--teal)}
.notch{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.notch::after{content:"cel";position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.legend{display:flex;gap:14px;margin-top:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend b{font-family:var(--mono);color:var(--ink);font-weight:600}
.dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px}

main{padding:var(--pad);max-width:680px;margin:0 auto}
.view{display:none} .view.on{display:block}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:16px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:11.5px}

.btn{border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:10px;
  padding:11px 14px;font-weight:600;line-height:1}
.btn.primary{background:var(--berry);border-color:var(--berry);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.sm{padding:7px 10px;font-size:13px;border-radius:8px}
.btn:active{transform:translateY(1px)} .btn:disabled{opacity:.45}
input[type=text],input[type=number],input[type=date],input[type=password],select,textarea{
  width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
label.fld{display:block;margin-bottom:10px}
label.fld > span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
:focus-visible{outline:2px solid var(--berry);outline-offset:2px}

.day{margin-bottom:18px}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:0 2px 6px}
.dayhead .d{font-family:var(--display);font-weight:800;font-size:17px}
.dayhead .k{font-family:var(--mono);font-size:12.5px;color:var(--muted)}
.dayhead .k.bad{color:var(--alert)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px}
.meal.eaten{opacity:.6}
.meal .slot{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--berry);font-weight:600}
.meal .name{font-family:var(--display);font-weight:600;font-size:16.5px;margin:2px 0 6px}
.macros{display:flex;gap:12px;font-family:var(--mono);font-size:12px;color:var(--muted);flex-wrap:wrap}
.macros b{color:var(--ink);font-weight:600}
.ings{margin:8px 0 0;padding:0;list-style:none;border-top:1px dashed var(--line);padding-top:8px}
.ings li{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.ings .nm{flex:1}
.ings input{width:74px;padding:5px 6px;text-align:right;font-family:var(--mono);font-size:14px}
.tag{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:2px 5px;border-radius:4px;
  border:1px solid var(--line);color:var(--muted)}
.tag.k{border-color:var(--berry);color:var(--berry)}
.tag.l{border-color:var(--ink);color:var(--ink);background:#EFEDE6}
.lockbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;
  width:30px;height:30px;line-height:1;padding:0;font-size:14px;cursor:pointer;flex:none;
  color:var(--muted);transition:background .12s,border-color .12s}
.lockbtn.on{border-color:var(--berry);background:#F6E9F0;color:var(--berry)}
.ings li.locked .nm{font-weight:600}
.lockbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.daybar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px 0}
.tag.p{border-color:#7A6A2E;color:#7A6A2E;background:#F6F2E2}
.hist{border-top:1px solid var(--line);padding:10px 0}
.hist:first-of-type{border-top:0}
.hist .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hist .dv{font-family:var(--mono);font-size:12px;color:var(--muted)}
.hist .mn{font-size:12.5px;color:var(--muted);margin:3px 0 6px;line-height:1.45}
.score{font-family:var(--mono);font-size:11px;padding:2px 6px;border-radius:999px;border:1px solid var(--line)}
.score.a{border-color:#2F6B45;color:#2F6B45;background:#E8F3EC}
.score.b{border-color:#7A6A2E;color:#7A6A2E;background:#F6F2E2}
.score.c{border-color:#8C3A3A;color:#8C3A3A;background:#F6E9E9}
.hfilter{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.hfilter button{font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);
  background:var(--surface);cursor:pointer;color:var(--muted)}
.hfilter button.on{border-color:var(--berry);color:var(--berry);background:#F6E9F0}
.rmbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:26px;height:30px;
  padding:0;font-size:16px;line-height:1;color:var(--muted);cursor:pointer;flex:none}
.rmbtn:active{border-color:#8C3A3A;color:#8C3A3A}
.addrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.addrow select{flex:1;padding:6px 8px;font-size:13px}
.swap{border-top:1px solid var(--line);padding:10px 0}
.swap:first-of-type{border-top:0}
.swap.cur{opacity:.6}
.swap .hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.swap .dv{font-family:var(--mono);font-size:12px;color:var(--muted);margin:3px 0 6px}
details summary{cursor:pointer;font-size:13px;color:var(--berry);font-weight:600;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+ "} details[open] summary::before{content:"– "}

.item{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .t{font-weight:500}
.pill{font-size:11px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);white-space:nowrap}
.pill.on{background:var(--berry);border-color:var(--berry);color:#fff}
.chk{width:22px;height:22px;accent-color:var(--berry)}
.done{opacity:.45;text-decoration:line-through}
.stars{letter-spacing:2px;color:var(--gold);font-size:13px}

nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:10px 2px 12px;color:var(--muted);font-size:10.5px;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav button .ic{font-size:17px;line-height:1}
nav button.on{color:var(--berry);font-weight:600}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(20,20,20,.42);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet .inner{background:var(--paper);width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:16px 16px calc(24px + env(safe-area-inset-bottom));max-width:680px;margin:0 auto}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%);z-index:80;background:var(--ink);
  color:var(--paper);padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;
  transition:opacity .18s;max-width:90%;text-align:center}
.toast.on{opacity:1}
.empty{text-align:center;padding:28px 10px;color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--berry);
  border-radius:50%;animation:s .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes s{to{transform:rotate(360deg)}}
video{width:100%;border-radius:12px;background:#000}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

<header>
  <div class="hrow"><h1 id="hTitle">Tydzień</h1><div class="hsub" id="hDate"></div></div>
  <div class="balance" id="balance"></div>
</header>

<main>
  <section class="view on" id="v-week">
    <div class="card">
      <div class="between">
        <div style="flex:1">
          <div class="eyebrow">Plan od</div>
          <input type="date" id="weekStart" style="margin-top:4px">
        </div>
        <button class="btn primary" id="btnGen">Ułóż tydzień</button>
      </div>
      <label class="fld" style="margin:12px 0 0">
        <span>Życzenia na ten tydzień (opcjonalnie)</span>
        <input type="text" id="wish" placeholder="np. w środę mało czasu, więcej azjatyckich">
      </label>
      <div class="row small muted" style="gap:14px;flex-wrap:wrap">
        <label class="row" style="gap:6px"><input type="checkbox" id="optAI" class="chk" checked> układa AI</label>
        <select id="optRepeat" style="width:auto;padding:6px 8px;font-size:13px">
          <option value="0">bez powtórek</option>
          <option value="1" selected>powtórki czasem</option>
          <option value="2">gotuję na 2 dni</option>
        </select>
        <button class="btn ghost sm" id="btnHistory">Historia dni</button>
      </div>
    </div>
    <div id="weekList"></div>
  </section>

  <section class="view" id="v-meals">
    <div class="between" style="margin-bottom:10px">
      <input type="text" id="mealSearch" placeholder="Szukaj posiłku" style="flex:1">
      <button class="btn sm ghost" id="btnAiMeal">AI</button>
      <button class="btn sm primary" id="btnNewMeal">Nowy</button>
    </div>
    <div id="mealList"></div>
  </section>

  <section class="view" id="v-prod">
    <div class="between" style="margin-bottom:10px">
      <input type="text" id="prodSearch" placeholder="Szukaj produktu" style="flex:1">
      <button class="btn sm primary" id="btnScan">Skanuj</button>
      <button class="btn sm ghost" id="btnNewProd">+</button>
    </div>
    <div id="prodList"></div>
  </section>

  <section class="view" id="v-shop">
    <div class="card">
      <div class="grid2">
        <label class="fld"><span>Od dnia</span><select id="shopFrom"></select></label>
        <label class="fld" style="margin-bottom:0"><span>Do dnia</span><select id="shopTo"></select></label>
      </div>
      <button class="btn primary" id="btnShop" style="width:100%;margin-top:4px">Zrób listę zakupów</button>
    </div>
    <div id="shopList"></div>
  </section>

  <section class="view" id="v-set">
    <div class="card">
      <h3>Cel dzienny</h3>
      <div class="grid2" style="margin-top:10px">
        <label class="fld"><span>Kalorie</span><input type="number" id="sKcal"></label>
        <label class="fld"><span>Białko (g)</span><input type="number" id="sProt"></label>
        <label class="fld"><span>Tłuszcz (g)</span><input type="number" id="sFat"></label>
        <label class="fld"><span>Węglowodany (g)</span><input type="number" id="sCarb" disabled></label>
      </div>
      <div class="grid3">
        <label class="fld"><span>Śniadanie %</span><input type="number" id="sB"></label>
        <label class="fld"><span>Obiad %</span><input type="number" id="sL"></label>
        <label class="fld"><span>Kolacja %</span><input type="number" id="sD"></label>
      </div>
      <p class="tiny muted" id="splitInfo" style="margin:0"></p>
    </div>
    <div class="card">
      <h3>Claude (AI)</h3>
      <p class="small muted">Adres Twojego proxy na Cloudflare i hasło z pliku worker.js.</p>
      <label class="fld"><span>Adres proxy</span><input type="text" id="aiUrl" placeholder="https://jadlospis-ai.xxx.workers.dev"></label>
      <label class="fld"><span>Hasło</span><input type="password" id="aiSecret"></label>
      <div class="row" style="gap:8px"><button class="btn ghost sm" id="btnAiTest">Sprawdź połączenie</button>
        <span class="small" id="aiStatus"></span></div>
    </div>
    <div class="card">
      <h3>Dane</h3>
      <p class="small muted">Wszystko siedzi w tym telefonie. Rób kopię co jakiś czas.</p>
      <div class="row" style="gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" id="btnExport">Zapisz kopię</button>
        <button class="btn ghost sm" id="btnImport">Wczytaj kopię / paczkę</button>
        <button class="btn ghost sm" id="btnForgetAll" style="display:none">Zapomnij gramatury</button>
        <button class="btn ghost sm" id="btnReset">Wyczyść wszystko</button>
      </div>
      <input type="file" id="fileIn" accept="application/json" style="display:none">
      <p class="tiny muted" id="storeInfo" style="margin-top:10px;white-space:pre-line"></p>
    </div>
  </section>
</main>

<nav>
  <button data-v="week" class="on"><span class="ic">▤</span>Tydzień</button>
  <button data-v="meals"><span class="ic">◍</span>Posiłki</button>
  <button data-v="prod"><span class="ic">☰</span>Produkty</button>
  <button data-v="shop"><span class="ic">✓</span>Zakupy</button>
  <button data-v="set"><span class="ic">⚙</span>Ustawienia</button>
</nav>

<div class="sheet" id="sheet"><div class="inner" id="sheetInner"></div></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ==========================================================================
   Jadłospis v2 — kotwice porcji, rebalans dnia, skaner etykiet, Claude.
   Liczenie makro robi kod (deterministycznie). AI tylko dobiera dania
   i czyta etykiety — nigdy nie liczy gramatury.
   ========================================================================== */

const APP_VER = "rev8 · 17.08.2026";   // widoczne w Ustawieniach — po aktualizacji sprawdź, czy się zgadza
const KEY   = "jadlospis.v2";
const SLOTS = [{id:"b",name:"Śniadanie"},{id:"l",name:"Obiad"},{id:"d",name:"Kolacja"}];
const CATS  = ["mięso i ryby","nabiał i jaja","zboża i pieczywo","warzywa","owoce","tłuszcze i orzechy","strączki","inne"];
const DOW   = ["niedziela","poniedziałek","wtorek","środa","czwartek","piątek","sobota"];

let S = null;

/* ---------- narzędzia ---------- */
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const r1  = v => Math.round((+v||0)*10)/10;
function todayISO(d){ const x=d||new Date(); return new Date(x-x.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function addDays(iso,n){ const d=new Date(iso+"T12:00:00"); d.setDate(d.getDate()+n); return todayISO(d); }
function dowOf(iso){ return new Date(iso+"T12:00:00").getDay(); }
function plDay(iso){ const d=new Date(iso+"T12:00:00"); const n=DOW[d.getDay()];
  return n[0].toUpperCase()+n.slice(1)+", "+d.getDate()+"."+String(d.getMonth()+1).padStart(2,"0"); }

/* ---------- pamięć ---------- */
function emptyState(){
  return { settings:{kcal:2400,prot:170,fat:75,split:{b:30,l:38,d:32},rules:[]},
           products:[], meals:[], plan:{}, log:[], shopChecked:{}, prefs:{}, clip:null,
           weekStart: todayISO(), ai:{url:"",secret:""} };
}
function load(){
  try{ const raw = localStorage.getItem(KEY); if(raw){ S = JSON.parse(raw);
       S.prefs = S.prefs || {}; if(!("clip" in S)) S.clip = null; return; } }catch(e){}
  S = emptyState(); save();
}

/* ---------- zapamiętane gramatury ----------
   Kiedy ręcznie zmienisz gramaturę, zapisujemy ją przy tym daniu. Następnym razem,
   gdy danie wypadnie w tygodniu, startuje z Twoich liczb, a solver trzyma się ich
   blisko (kara za odejście od bazy). To nie AI — to deterministyczna pamięć aplikacji. */
function prefSet(recipeId, pid, g){
  if(!recipeId) return;
  S.prefs = S.prefs || {};
  (S.prefs[recipeId] = S.prefs[recipeId] || {})[pid] = Math.max(1, Math.round(g));
}
function prefClear(recipeId){ if(S.prefs) delete S.prefs[recipeId]; }
const prefCount = () => Object.keys(S.prefs||{}).length;
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- makro ---------- */
const P  = id => S.products.find(p=>p.id===id);
const per = p => ({k:p.kcal/100, p:p.prot/100, c:p.carb/100, f:p.fat/100});
function sumMacro(list){
  let k=0,p=0,c=0,f=0;
  for(const i of list){ const pr=P(i.pid); if(!pr) continue; const g=i.g/100;
    k+=pr.kcal*g; p+=pr.prot*g; c+=pr.carb*g; f+=pr.fat*g; }
  return {kcal:k, prot:p, carb:c, fat:f};
}
const targetCarb = () => Math.max(0, Math.round((S.settings.kcal - S.settings.prot*4 - S.settings.fat*9)/4));
const dayTarget  = () => ({kcal:S.settings.kcal, prot:S.settings.prot, carb:targetCarb(), fat:S.settings.fat});
function slotTarget(slot){ const q=S.settings.split[slot]/100; const t=dayTarget();
  return {kcal:t.kcal*q, prot:t.prot*q, carb:t.carb*q, fat:t.fat*q}; }
function dayIngs(day){ const a=[]; SLOTS.forEach(s=>{ if(day&&day[s.id]) a.push(...day[s.id].ings); }); return a; }
function dayMacro(iso){ const d=S.plan[iso]; return d ? sumMacro(dayIngs(d)) : null; }

/* ==========================================================================
   SOLVER — dobiera gramatury tak, żeby dzień trafił w cel.
   Kotwice (mięso, jajka, ryż, całe opakowania) trzymają się swojej wartości;
   ruszają się dopiero, gdy bufory nie dają rady. Zablokowane (Twoja ręczna
   zmiana) nie ruszają się nigdy. Posiłek oznaczony jako zjedzony jest
   zamrożony w całości — to już się wydarzyło, więc dopasowujemy resztę dnia.
   ========================================================================== */
const W = {kcal:1/9, prot:1.4, carb:0.45, fat:0.9, anchor:0.35, pref:0.22};

function solveDay(day, target){
  const vars = [];
  SLOTS.forEach(s=>{
    const e = day[s.id]; if(!e) return;
    if(e.eaten) return;              // zjedzone = fakt, nie plan — nie ruszamy
    e.ings.forEach(i=>{
      if(i.locked || i.role==="staly") return;
      const pr = P(i.pid); if(!pr) return;
      const lo = Math.max(1, Math.round(i.min ?? (i.role==="kotwica" ? i.g : i.g*0.35)));
      const hi = Math.max(lo, Math.round(i.max ?? (i.role==="kotwica" ? i.g : Math.min(600, i.g*2.6))));
      if(hi <= lo) return;
      vars.push({ing:i, per:per(pr), lo, hi, base:(i.base ?? i.g),
                 anchor:i.role==="kotwica", pref:!!i.pref});
    });
  });

  let tot = sumMacro(dayIngs(day));
  const pen = () => vars.reduce((a,v)=> a
      + (v.anchor ? W.anchor*Math.abs(v.ing.g - v.base) : 0)
      + (v.pref   ? W.pref  *Math.abs(v.ing.g - v.base) : 0), 0);
  const err = t => W.kcal*Math.abs(t.kcal-target.kcal) + W.prot*Math.abs(t.prot-target.prot)
                 + W.carb*Math.abs(t.carb-target.carb) + W.fat*Math.abs(t.fat-target.fat);
  const shift = (v, from, to) => {          // per(...) jest na 1 g
    const d = to - from;
    tot.kcal+=v.per.k*d; tot.prot+=v.per.p*d; tot.carb+=v.per.c*d; tot.fat+=v.per.f*d;
  };

  if(!vars.length) return {tot, err:err(tot)};

  const cand = (v)=>{
    const out=new Set([v.ing.g, v.lo, v.hi, v.base]);
    const step=Math.max(1,Math.round((v.hi-v.lo)/16));
    for(let g=v.lo; g<=v.hi; g+=step) out.add(g);
    return [...out].filter(g=>g>=v.lo && g<=v.hi);
  };

  for(let pass=0; pass<6; pass++){
    let moved=false;
    for(const v of vars){
      const cur=v.ing.g;
      let bestG=cur, bestS=err(tot)+pen();
      const list = pass<2 ? cand(v) : [cur-15,cur-6,cur-2,cur-1,cur+1,cur+2,cur+6,cur+15]
                                       .filter(g=>g>=v.lo&&g<=v.hi);
      for(const g of list){
        if(g===cur) continue;
        shift(v,cur,g); v.ing.g=g;
        const sc = err(tot)+pen();
        if(sc < bestS-1e-9){ bestS=sc; bestG=g; }
        shift(v,g,cur); v.ing.g=cur;
      }
      if(bestG!==cur){ shift(v,cur,bestG); v.ing.g=bestG; moved=true; }
    }
    if(!moved && pass>=2) break;
  }
  return {tot: sumMacro(dayIngs(day)), err: err(sumMacro(dayIngs(day)))};
}

function ingsFromMeal(meal){
  const pr = (S.prefs||{})[meal.id] || {};
  return meal.ings.map(i=>{
    const zap = pr[i.pid];
    const g = (zap!=null && i.role!=="staly") ? zap : i.g;
    return {pid:i.pid, g, base:g, role:i.role||"bufor",
            min:i.min, max:i.max, locked:false, pref:(zap!=null && i.role!=="staly")};
  });
}
function buildDay(sel){
  const day = {};
  SLOTS.forEach(s=>{
    const m = S.meals.find(x=>x.id===sel[s.id]);
    if(m) day[s.id] = {recipeId:m.id, ings:ingsFromMeal(m)};
  });
  return day;
}
function rebalance(iso){
  const day = S.plan[iso]; if(!day) return;
  solveDay(day, dayTarget());
  save();
}
function dayStatus(iso){
  const m = dayMacro(iso); if(!m) return null;
  const t = dayTarget();
  const ok = Math.abs(m.kcal-t.kcal)<=60 && Math.abs(m.prot-t.prot)<=8
          && Math.abs(m.carb-t.carb)<=15 && Math.abs(m.fat-t.fat)<=6;
  return {m, ok};
}

/* ==========================================================================
   WYBÓR DAŃ — lokalny (zawsze działa) i przez Claude (jeśli podłączony)
   ========================================================================== */
function candidates(slot, dow){
  const excl = new Set(S.products.filter(p=>p.excluded).map(p=>p.id));
  let pool = S.meals.filter(m => m.slot===slot && !m.ings.some(i=>excl.has(i.pid)));
  const rule = (S.settings.rules||[]).find(r=>r.dow===dow && r.slot===slot);
  if(rule){ const tagged = pool.filter(m=>(m.tags||[]).includes(rule.tag)); if(tagged.length) return tagged; }
  else { pool = pool.filter(m => !(m.tags||[]).includes("stek") || slot!=="l"); }
  return pool;
}
/* Białko jest najsztywniejsze — siedzi w kotwicach, więc bufory go nie naprawią.
   Dlatego zestaw dnia dobieramy tak, żeby suma białka z bazowych gramatur
   była blisko celu; resztę (kcal, węgle, tłuszcz) doreguluje solver.        */
function selBounds(sel){
  const fl={k:0,p:0,c:0,f:0}, ce={k:0,p:0,c:0,f:0};
  SLOTS.forEach(s=>{
    const m = S.meals.find(x=>x.id===sel[s.id]); if(!m) return;
    m.ings.forEach(i=>{
      const pr=P(i.pid); if(!pr) return; const u=per(pr);
      const lo = i.role==="staly" ? i.g : (i.min ?? i.g);
      const hi = i.role==="staly" ? i.g : (i.max ?? i.g);
      fl.k+=u.k*lo; fl.p+=u.p*lo; fl.c+=u.c*lo; fl.f+=u.f*lo;
      ce.k+=u.k*hi; ce.p+=u.p*hi; ce.c+=u.c*hi; ce.f+=u.f*hi;
    });
  });
  return {fl,ce};
}
/* 0 = dzień da się doregulować do celu; więcej = zestaw z góry nie trafi */
function selScore(sel){
  const {fl,ce} = selBounds(sel), t = dayTarget();
  const d = (lo,hi,x) => x<lo ? lo-x : (x>hi ? x-hi : 0);
  return d(fl.k,ce.k,t.kcal)/9 + 1.4*d(fl.p,ce.p,t.prot)
       + 0.45*d(fl.c,ce.c,t.carb) + 0.9*d(fl.f,ce.f,t.fat);
}
function pickWeighted(list){
  const w = list.map(m=>Math.pow(m.rating||3,2));
  let r = Math.random()*w.reduce((a,b)=>a+b,0), pick = list[list.length-1];
  for(let j=0;j<list.length;j++){ r-=w[j]; if(r<=0) return list[j]; }
  return pick;
}
function poolsFor(dow, recent, mode){
  const back = mode===0 ? 4 : (mode===1 ? 2 : 1);
  const out = {};
  SLOTS.forEach(s=>{
    const pool = candidates(s.id, dow);
    let avail = pool.filter(m=>!recent[s.id].slice(-back).includes(m.id));
    out[s.id] = avail.length ? avail : pool;
  });
  return out;
}
function fixSelection(day, pools){          // podmienia danie, jeśli zestaw nie da się doregulować
  let best = {...day}, bestE = selScore(best);
  for(let round=0; round<2 && bestE>0.5; round++){
    let improved = false;
    for(const s of SLOTS){
      for(const m of (pools[s.id]||[])){
        const trial = {...best, [s.id]:m.id};
        const e = selScore(trial);
        if(e < bestE-0.5){ best = trial; bestE = e; improved = true; }
      }
    }
    if(!improved) break;
  }
  return best;
}
function pickLocal(start){
  const mode = +document.getElementById("optRepeat").value;
  const sel = [];
  const recent = {b:[], l:[], d:[]};
  for(let i=0;i<7;i++){
    const iso = addDays(start,i), dow = dowOf(iso);
    const pools = poolsFor(dow, recent, mode);
    let best=null, bestScore=Infinity;
    for(let attempt=0; attempt<60; attempt++){
      const day = {};
      SLOTS.forEach(s=>{
        const pool = pools[s.id];
        if(!pool || !pool.length){ day[s.id]=null; return; }
        if(mode===2 && s.id==="l" && i%2===1 && sel[i-1] && sel[i-1].l && dow!==0
           && candidates("l",dow).some(m=>m.id===sel[i-1].l)){ day[s.id]=sel[i-1].l; return; }
        day[s.id] = pickWeighted(pool).id;
      });
      const sc = selScore(day);
      if(sc < bestScore){ bestScore = sc; best = day; }
      if(sc === 0) break;
    }
    SLOTS.forEach(s=>{ if(best[s.id]) recent[s.id].push(best[s.id]); });
    sel.push(best);
  }
  return sel;
}

Dbaj o różnorodność źródeł białka i kuchni w tygodniu, nie powtarzaj tego samego dania w dwa kolejne dni (chyba że tryb powtórek na to pozwala), wyżej oceniane dania mogą pojawiać się częściej, w dni robocze preferuj krótszy czas przygotowania.
Odpowiadasz WYŁĄCZNIE obiektem JSON, bez komentarza i bez markdown:
{"dni":[{"data":"YYYY-MM-DD","b":"nazwa","l":"nazwa","d":"nazwa"}]}`;

  const user = `Dni: ${JSON.stringify(dni)}
Dostępne dania: ${JSON.stringify(menu)}
Ostatnio jedzone: ${JSON.stringify(hist)}
Dania dopasowane przez użytkownika (ręcznie poprawiał gramatury — traktuj jako sprawdzone i chętniej po nie sięgaj): ${JSON.stringify(dopasowane)}
Życzenia użytkownika: ${wish||"brak"}`;

  const txt = await aiCall({model:"claude-opus-5", max_tokens:2000, system:sys,
                            messages:[{role:"user",content:user}]});

async function generateWeek(){
  const start = document.getElementById("weekStart").value || todayISO();
  const wish  = document.getElementById("wish").value.trim();
  const useAI = document.getElementById("optAI").checked && S.ai.url;
  if(!S.meals.length){ toast("Najpierw wczytaj bazę startową w Ustawieniach."); return; }
  S.weekStart = start;
  let sel = null, viaAI = false;
  if(useAI){
    busy(true,"Claude układa tydzień…");
    try{ sel = await pickAI(start, wish); viaAI = true; }
    catch(e){ toast("AI nie odpowiedziało — układam lokalnie."); }
    busy(false);
  }
  const fallback = pickLocal(start);
  if(!sel) sel = fallback;
  else {
    const mode = +document.getElementById("optRepeat").value;
    const recent = {b:[],l:[],d:[]};
    for(let i=0;i<7;i++){
      SLOTS.forEach(s=>{ if(!sel[i][s.id]) sel[i][s.id] = fallback[i][s.id]; });
      sel[i] = fixSelection(sel[i], poolsFor(dowOf(addDays(start,i)), recent, mode));
      SLOTS.forEach(s=>{ if(sel[i][s.id]) recent[s.id].push(sel[i][s.id]); });
    }
  }
  for(let i=0;i<7;i++){
    const iso = addDays(start,i);
    const day = buildDay(sel[i]);
    if(!Object.keys(day).length) continue;
    S.plan[iso] = day;
    solveDay(day, dayTarget());
  }
  save(); renderWeek(); renderShopSelectors();
  toast(viaAI ? "Tydzień ułożony przez Claude'a." : "Tydzień ułożony.");
}

/* Czy dzień da się jeszcze doregulować do celu, jeśli w tym miejscu wstawimy dane danie?
   Bierze pod uwagę faktyczny stan dnia: zjedzone i zablokowane liczą się jako sztywne. */
/* Nowy składnik w konkretnym dniu — nie rusza przepisu, tylko ten jeden posiłek. */
function addIngToPlan(iso, slotId, pid){
  const e = S.plan[iso] && S.plan[iso][slotId]; if(!e) return;
  const pr = P(pid); if(!pr) return;
  if(e.ings.some(i=>i.pid===pid)){ toast("Ten składnik już tam jest."); return; }
  const tlusty = pr.cat==="tłuszcze i orzechy";
  const g   = tlusty ? 10 : 50;
  const min = tlusty ? 3  : 10;
  const max = tlusty ? 30 : 250;
  e.ings.push({pid, g, base:g, role:"bufor", min, max, locked:false, pref:false});
  rebalance(iso); renderWeek(); renderBalance();
  toast(`Dodane: ${pr.name}`);
}
function rmIngFromPlan(iso, slotId, idx){
  const e = S.plan[iso] && S.plan[iso][slotId]; if(!e) return;
  const pr = P(e.ings[idx] && e.ings[idx].pid);
  if(e.ings.length<=1){ toast("Posiłek musi mieć co najmniej jeden składnik."); return; }
  e.ings.splice(idx,1);
  rebalance(iso); renderWeek(); renderBalance();
  toast(`Usunięte: ${pr?pr.name:"składnik"}`);
}

function fitAfterSwap(iso, slotId, meal){
  const day = S.plan[iso]; if(!day) return null;
  const fl={kcal:0,prot:0,carb:0,fat:0}, ce={kcal:0,prot:0,carb:0,fat:0};
  const add = (pid, lo, hi)=>{
    const pr = P(pid); if(!pr) return; const u = per(pr);
    fl.kcal+=u.k*lo; fl.prot+=u.p*lo; fl.carb+=u.c*lo; fl.fat+=u.f*lo;
    ce.kcal+=u.k*hi; ce.prot+=u.p*hi; ce.carb+=u.c*hi; ce.fat+=u.f*hi;
  };
  SLOTS.forEach(sx=>{
    if(sx.id === slotId){
      meal.ings.forEach(i=>{
        const sztywny = i.role==="staly";
        add(i.pid, sztywny ? i.g : (i.min ?? i.g), sztywny ? i.g : (i.max ?? i.g));
      });
      return;
    }
    const e = day[sx.id]; if(!e) return;
    e.ings.forEach(i=>{
      const sztywny = e.eaten || i.locked || i.role==="staly";
      add(i.pid, sztywny ? i.g : (i.min ?? i.g), sztywny ? i.g : (i.max ?? i.g));
    });
  });
  const t = dayTarget();
  const d = (lo,hi,x)=> x<lo ? lo-x : (x>hi ? x-hi : 0);
  const score = d(fl.kcal,ce.kcal,t.kcal)/9 + 1.4*d(fl.prot,ce.prot,t.prot)
              + 0.45*d(fl.carb,ce.carb,t.carb) + 0.9*d(fl.fat,ce.fat,t.fat);
  return {score, ok: score < 0.5};
}

/* ==========================================================================
   SCHOWEK — kopiowanie posiłków i całych dni
   ========================================================================== */
function cloneIngs(list){ return list.map(i=>({...i})); }

function copyMeal(iso, slotId){
  const e = S.plan[iso] && S.plan[iso][slotId]; if(!e) return;
  const m = S.meals.find(x=>x.id===e.recipeId);
  S.clip = {type:"meal", slot:slotId, recipeId:e.recipeId,
            ings:cloneIngs(e.ings), label:(m?m.name:"posiłek")};
  save(); renderWeek(); toast(`Skopiowane: ${m?m.name:"posiłek"}`);
}
function copyDay(iso){
  const d = S.plan[iso]; if(!d) return;
  const day = {};
  SLOTS.forEach(s=>{ if(d[s.id]) day[s.id] = {recipeId:d[s.id].recipeId, ings:cloneIngs(d[s.id].ings)}; });
  S.clip = {type:"day", day, label:plDay(iso)};
  save(); renderWeek(); toast(`Skopiowany dzień: ${plDay(iso)}`);
}
function pasteMeal(iso, slotId){
  const c = S.clip; if(!c || c.type!=="meal") return;
  if(c.slot !== slotId){ toast("To posiłek na inną porę dnia."); return; }
  const day = S.plan[iso]; if(!day) return;
  const stare = day[slotId] && S.meals.find(m=>m.id===day[slotId].recipeId);
  day[slotId] = {recipeId:c.recipeId, ings:cloneIngs(c.ings)};
  logAdd(iso, slotId, stare?stare.name:"?", "wklejone");
  solveDay(day, dayTarget()); save(); renderWeek(); renderBalance();
  toast("Wklejone — reszta dnia dopasowana.");
}
function pasteDay(iso){
  const c = S.clip; if(!c || c.type!=="day") return;
  const day = {};
  SLOTS.forEach(s=>{ if(c.day[s.id]) day[s.id] = {recipeId:c.day[s.id].recipeId, ings:cloneIngs(c.day[s.id].ings)}; });
  S.plan[iso] = day;
  logAdd(iso, "-", c.label, "wklejony dzień");
  save(); renderWeek(); renderShopSelectors(); renderBalance();
  toast("Dzień wklejony — gramatury bez zmian.");
}

/* ==========================================================================
   HISTORIA DNI — przeglądanie wszystkich ułożonych dni, od najnowszych.
   Pokazuje odchyłkę od celu, żeby dało się szybko znaleźć dzień „w punkt"
   i skopiować go w całości.
   ========================================================================== */
let histFilter = "all";

function dayDelta(iso){
  const m = dayMacro(iso); if(!m) return null;
  const t = dayTarget();
  const d = {kcal:m.kcal-t.kcal, prot:m.prot-t.prot, carb:m.carb-t.carb, fat:m.fat-t.fat};
  /* jedna liczba na „jak blisko" — te same wagi, którymi liczy solver */
  const score = Math.abs(d.kcal)/9 + 1.4*Math.abs(d.prot) + 0.45*Math.abs(d.carb) + 0.9*Math.abs(d.fat);
  return {m, d, score};
}
function histRows(){
  const rows = [];
  Object.keys(S.plan).forEach(iso=>{
    const day = S.plan[iso];
    if(!day || !SLOTS.some(s=>day[s.id])) return;
    const dd = dayDelta(iso); if(!dd) return;
    const st = dayStatus(iso);
    const eaten = SLOTS.filter(s=>day[s.id] && day[s.id].eaten).length;
    const total = SLOTS.filter(s=>day[s.id]).length;
    const names = SLOTS.map(s=>{
      const e = day[s.id]; if(!e) return null;
      const m = S.meals.find(x=>x.id===e.recipeId);
      return m ? m.name : "usunięte danie";
    }).filter(Boolean);
    rows.push({iso, ...dd, ok:st.ok, eaten, total, names});
  });
  rows.sort((a,b)=> a.iso < b.iso ? 1 : -1);
  return rows;
}
function renderHistory(){
  const all = histRows();
  const rows = histFilter==="ok"    ? all.filter(r=>r.ok)
             : histFilter==="eaten" ? all.filter(r=>r.eaten>0)
             : all;
  const sgn = v => (v>=0?"+":"") + Math.round(v);
  const body = rows.length ? rows.map(r=>{
    /* „w punkt" = ten sam próg, co zielona liczba w nagłówku dnia */
    const cls = r.ok ? "a" : r.score<60 ? "b" : "c";
    const etykieta = r.ok ? "w punkt" : r.score<60 ? "blisko" : "rozjechany";
    return `<div class="hist">
      <div class="hd">
        <strong>${plDay(r.iso)}</strong>
        <span class="score ${cls}">${etykieta}</span>
      </div>
      <div class="dv">${Math.round(r.m.kcal)} kcal (${sgn(r.d.kcal)}) ·
        B${Math.round(r.m.prot)} (${sgn(r.d.prot)}) ·
        W${Math.round(r.m.carb)} (${sgn(r.d.carb)}) ·
        T${Math.round(r.m.fat)} (${sgn(r.d.fat)})${r.eaten?` · zjedzone ${r.eaten}/${r.total}`:""}</div>
      <div class="mn">${r.names.map(esc).join(" · ")}</div>
      <button class="btn ghost sm" data-histcopy="${r.iso}">Kopiuj ten dzień</button>
    </div>`;
  }).join("") : `<div class="empty"><p class="small">Nic tu jeszcze nie ma${histFilter!=="all"?" dla tego filtra":""}.</p></div>`;

  openSheet(`
    <h3>Historia dni</h3>
    <p class="small muted" style="margin:2px 0 0">${all.length} ${all.length===1?"dzień":"dni"} w pamięci.
      Skopiuj dzień, a potem wklej go w tygodniu przyciskiem „Wklej dzień".</p>
    <div class="hfilter">
      <button data-hf="all"   class="${histFilter==="all"?"on":""}">wszystkie</button>
      <button data-hf="ok"    class="${histFilter==="ok"?"on":""}">tylko w punkt</button>
      <button data-hf="eaten" class="${histFilter==="eaten"?"on":""}">tylko zjedzone</button>
    </div>
    <div>${body}</div>`);

  const inner = document.getElementById("sheetInner");
  inner.querySelectorAll("[data-hf]").forEach(b=> b.onclick=()=>{
    histFilter = b.dataset.hf; renderHistory(); });
  inner.querySelectorAll("[data-histcopy]").forEach(b=> b.onclick=()=>{
    copyDay(b.dataset.histcopy); closeSheet(); });
}

function applySwap(iso, slotId, mealId){
  const day = S.plan[iso]; if(!day) return;
  const meal = S.meals.find(m=>m.id===mealId); if(!meal) return;
  const stare = day[slotId] && S.meals.find(m=>m.id===day[slotId].recipeId);
  day[slotId] = {recipeId:meal.id, ings:ingsFromMeal(meal)};
  logAdd(iso, slotId, stare?stare.name:"?", "zamienione");
  solveDay(day, dayTarget()); save(); closeSheet(); renderWeek(); renderBalance();
  toast(`Wstawione: ${meal.name}`);
}

let swapQuery = "", swapAll = false;
function rerollMeal(iso, slotId){
  const day = S.plan[iso]; if(!day||!day[slotId]) return;
  swapQuery = ""; swapAll = false;
  renderSwap(iso, slotId);
}
function renderSwap(iso, slotId){
  const day = S.plan[iso];
  const teraz = day[slotId] ? day[slotId].recipeId : null;
  const slotName = (SLOTS.find(s=>s.id===slotId)||{}).name || "";
  const q = swapQuery.toLowerCase().trim();
  let lista = S.meals.filter(m => swapAll || m.slot===slotId);
  if(q) lista = lista.filter(m => m.name.toLowerCase().includes(q));
  lista = lista.map(m=>{
    const mm = sumMacro(m.ings.map(i=>({pid:i.pid,g:i.g})));
    const fit = fitAfterSwap(iso, slotId, m);
    return {m, mm, fit};
  }).sort((a,b)=>
      (b.fit.ok?1:0)-(a.fit.ok?1:0) || (b.m.rating||3)-(a.m.rating||3)
      || a.m.name.localeCompare(b.m.name,"pl"));

  const body = lista.length ? lista.map(({m,mm,fit})=>`
    <div class="swap ${m.id===teraz?"cur":""}">
      <div class="hd">
        <strong>${esc(m.name)}</strong>
        <span class="score ${fit.ok?"a":"b"}">${fit.ok?"pasuje":"naciągnie dzień"}</span>
      </div>
      <div class="dv">${Math.round(mm.kcal)} kcal · B${Math.round(mm.prot)} · W${Math.round(mm.carb)} · T${Math.round(mm.fat)}
        · ${"★".repeat(m.rating||3)} · ${m.time||20} min${m.slot!==slotId?` · <em>${(SLOTS.find(s=>s.id===m.slot)||{}).name}</em>`:""}</div>
      ${m.id===teraz ? `<span class="tiny muted">teraz w planie</span>`
                     : `<button class="btn ghost sm" data-swap="${m.id}">Wstaw</button>`}
    </div>`).join("") : `<div class="empty"><p class="small">Nic nie pasuje do wyszukiwania.</p></div>`;

  openSheet(`
    <h3>Zamień — ${esc(slotName)}, ${plDay(iso)}</h3>
    <input type="text" id="swapQ" placeholder="Szukaj dania" value="${esc(swapQuery)}" style="margin-top:8px">
    <div class="row small muted" style="gap:12px;margin:8px 0 2px;flex-wrap:wrap">
      <label class="row" style="gap:6px"><input type="checkbox" id="swapAll" class="chk" ${swapAll?"checked":""}> dania z innych pór dnia</label>
      <button class="btn ghost sm" id="swapRand">Losuj za mnie</button>
    </div>
    <p class="tiny muted" style="margin:6px 0 0">„Pasuje" = dzień da się jeszcze doregulować do celu; liczone z uwzględnieniem zjedzonych i zablokowanych.</p>
    <div style="margin-top:6px">${body}</div>
    <button class="btn ghost" id="swapClose" style="width:100%;margin-top:12px">Zamknij</button>`);

  const inner = document.getElementById("sheetInner");
  const qi = document.getElementById("swapQ");
  qi.oninput = ()=>{ swapQuery = qi.value; const pos=qi.selectionStart;
    renderSwap(iso, slotId);
    const nq=document.getElementById("swapQ"); nq.focus(); nq.setSelectionRange(pos,pos); };
  document.getElementById("swapAll").onchange = e=>{ swapAll = e.target.checked; renderSwap(iso, slotId); };
  document.getElementById("swapClose").onclick = closeSheet;
  document.getElementById("swapRand").onclick = ()=>{
    const pula = lista.filter(x=>x.m.id!==teraz);
    const dobre = pula.filter(x=>x.fit.ok);
    const src = dobre.length ? dobre : pula;
    if(!src.length){ toast("Nie ma z czego losować."); return; }
    const w = src.map(x=>Math.pow(x.m.rating||3,2));
    let r = Math.random()*w.reduce((a,b)=>a+b,0), pick = src[src.length-1];
    for(let j=0;j<src.length;j++){ r-=w[j]; if(r<=0){ pick = src[j]; break; } }
    applySwap(iso, slotId, pick.m.id);
  };
  inner.querySelectorAll("[data-swap]").forEach(b=> b.onclick=()=> applySwap(iso, slotId, b.dataset.swap));
}
function logAdd(date, slot, name, action){
  S.log = S.log || []; S.log.push({date, slot, name, action});
  if(S.log.length>300) S.log = S.log.slice(-300);
}

/* ==========================================================================
   AI — wszystko przez Twój proxy (klucz nigdy nie leży w telefonie)
   ========================================================================== */
function stripJson(t){
  const s = String(t).trim().replace(/^```(json)?/i,"").replace(/```$/,"").trim();
  const a = s.indexOf("{"), b = s.lastIndexOf("}");
  return (a>=0 && b>a) ? s.slice(a,b+1) : s;
}
async function aiCall(body){
  if(!S.ai.url) throw new Error("Brak adresu proxy");
  const r = await fetch(S.ai.url, {
    method:"POST",
    headers:{"Content-Type":"application/json","X-App-Secret":S.ai.secret||""},
    body: JSON.stringify(body)
  });
  if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
  const d = await r.json();
  if(d.error) throw new Error(d.error.message||"błąd API");
  return (d.content||[]).map(c=>c.text||"").join("\n");
}

async function aiLabel(base64, mime){
  const sys = `Czytasz zdjęcie tabeli wartości odżywczych polskiego produktu spożywczego.
Zwracasz WYŁĄCZNIE JSON, bez komentarza:
{"name":"nazwa produktu z marką","kcal":0,"prot":0,"carb":0,"fat":0,"cat":"jedna z: ${CATS.join(' | ')}","piece":null,"pack":null}
kcal/prot/carb/fat ZAWSZE przeliczone na 100 g lub 100 ml produktu (jeśli tabela podaje na porcję, przelicz).
pack = masa netto opakowania w gramach jeśli widoczna (dla produktów w zalewie: masa po odsączeniu), inaczej null.
piece = masa jednej sztuki w gramach jeśli produkt jest sztukowy, inaczej null.
Jeśli czegoś nie widać, wpisz null. Nie zgaduj marki, której nie widzisz.`;
  const txt = await aiCall({model:"claude-sonnet-5", max_tokens:600, system:sys, messages:[{
    role:"user", content:[
      {type:"image", source:{type:"base64", media_type:mime, data:base64}},
      {type:"text", text:"Odczytaj wartości odżywcze."}]}]});
  return JSON.parse(stripJson(txt));
}

async function aiRecipes(wish){
  const prods = S.products.map(p=>p.name);
  const have  = S.meals.map(m=>m.name);
  const sys = `Tworzysz przepisy do aplikacji dietetycznej. Zwracasz WYŁĄCZNIE JSON:
{"meals":[{"name":"...","slot":"b|l|d","rating":4,"time":25,"tags":[],
 "ings":[{"p":"dokładna nazwa produktu z listy","g":100,"role":"kotwica|bufor|staly","min":0,"max":0}]}]}
Zasady ról (bardzo ważne):
- "kotwica" — mięso na obiad (min 250, max 300), jajka (min 150, max 170), ryż/makaron/kasza sucha (min 90, max 110), produkt zjadany w całym opakowaniu (min=max=masa opakowania).
- "bufor" — pieczywo, ziemniaki, płatki, oliwa, jogurt, owoce, ser. min = ok. 40% wartości g, max = ok. 250%.
- "staly" — warzywa, sosy, przyprawy, zioła: min=max=g.
Używasz WYŁĄCZNIE produktów z listy. Gramatury podajesz na jedną porcję dla mężczyzny na 2400 kcal (śniadanie ~720, obiad ~910, kolacja ~770 kcal). Przepisy proste i szybkie.`;
  const user = `Lista produktów: ${JSON.stringify(prods)}
Mam już takie dania (nie powtarzaj): ${JSON.stringify(have)}
Czego szukam: ${wish}`;
  const txt = await aiCall({model:"claude-opus-5", max_tokens:4000, system:sys,
                            messages:[{role:"user",content:user}]});
  return JSON.parse(stripJson(txt));
}

function renderBalance(){
  const el = document.getElementById("balance");
  const iso = todayISO();
  const m = dayMacro(iso) || {kcal:0,prot:0,carb:0,fat:0};
  const t = dayTarget();
  const kP=m.prot*4, kC=m.carb*4, kF=m.fat*9;
  const scale = Math.max(t.kcal*1.25, m.kcal*1.05, 1);
  const w = v => (v/scale*100).toFixed(1)+"%";
  el.innerHTML = `
    <div class="bar">
      <span class="p" style="width:${w(kP)}"></span><span class="c" style="width:${w(kC)}"></span>
      <span class="f" style="width:${w(kF)}"></span>
      <div class="notch" style="left:${(t.kcal/scale*100).toFixed(1)}%"></div>
    </div>
    <div class="legend">
      ${m.kcal ? `<span><b class="num">${Math.round(m.kcal)}</b> / ${t.kcal} kcal</span>`
               : `<span class="muted">Dziś nic nie zaplanowane</span>`}
      <span><i class="dot" style="background:var(--berry)"></i>B <b>${Math.round(m.prot)}</b>/${t.prot}</span>
      <span><i class="dot" style="background:var(--gold)"></i>W <b>${Math.round(m.carb)}</b>/${t.carb}</span>
      <span><i class="dot" style="background:var(--teal)"></i>T <b>${Math.round(m.fat)}</b>/${t.fat}</span>
    </div>`;
  document.getElementById("hDate").textContent = plDay(iso);
}

function renderWeek(){
  const wrap = document.getElementById("weekList");
  const open = new Set([...wrap.querySelectorAll("details[open][data-key]")].map(d=>d.dataset.key));
  const scrollY = window.scrollY;
  const start = S.weekStart || todayISO();
  document.getElementById("weekStart").value = start;
  let html = "", any = false;
  for(let i=0;i<7;i++){
    const iso = addDays(start,i), day = S.plan[iso];
    if(!day) continue;
    any = true;
    const st = dayStatus(iso);
    const clip = S.clip;
    html += `<div class="day"><div class="dayhead">
      <span class="d">${plDay(iso)}</span>
      <span class="k ${st.ok?"":"bad"}">${Math.round(st.m.kcal)} kcal · B${Math.round(st.m.prot)} W${Math.round(st.m.carb)} T${Math.round(st.m.fat)}</span>
    </div>
    <div class="daybar">
      <button class="btn ghost sm" data-copyday="${iso}">Kopiuj dzień</button>
      ${clip && clip.type==="day" ? `<button class="btn ghost sm" data-pasteday="${iso}">Wklej dzień · ${esc(clip.label)}</button>` : ""}
    </div>`;
    SLOTS.forEach(s=>{
      const e = day[s.id]; if(!e) return;
      const meal = S.meals.find(m=>m.id===e.recipeId);
      const mm = sumMacro(e.ings);
      const nLock = e.ings.filter(i=>i.locked).length;
      const hasPref = !!(S.prefs && S.prefs[e.recipeId] && Object.keys(S.prefs[e.recipeId]).length);
      html += `<div class="meal ${e.eaten?"eaten":""}">
        <div class="between">
          <span class="slot">${s.name}</span>
          <div class="row" style="gap:6px">
            <button class="btn ghost sm" data-eat="${iso}|${s.id}">${e.eaten?"✓ zjedzone":"Zjedzone"}</button>
            <button class="btn ghost sm" data-copymeal="${iso}|${s.id}" title="Kopiuj ten posiłek z gramaturami">⧉</button>
            ${S.clip && S.clip.type==="meal" && S.clip.slot===s.id
              ? `<button class="btn ghost sm" data-pastemeal="${iso}|${s.id}" title="Wklej: ${esc(S.clip.label)}">⤵</button>` : ""}
            <button class="btn ghost sm" data-reroll="${iso}|${s.id}">Zamień</button>
          </div>
        </div>
        <div class="name">${meal?esc(meal.name):"usunięte danie"}${hasPref?` <span class="tag p">twoje gramatury</span>`:""}${e.eaten?` <span class="tag l">zamrożone</span>`:""}</div>
        <div class="macros"><span><b>${Math.round(mm.kcal)}</b> kcal</span><span>B <b>${Math.round(mm.prot)}</b></span>
          <span>W <b>${Math.round(mm.carb)}</b></span><span>T <b>${Math.round(mm.fat)}</b></span>
          ${meal&&meal.time?`<span>${meal.time} min</span>`:""}</div>
        <details data-key="${iso}|${s.id}"><summary>Gramatura${nLock?` · ${nLock} 🔒`:""}</summary>
          <ul class="ings">${e.ings.map((ing,idx)=>{
            const p=P(ing.pid); if(!p) return "";
            const unit = p.piece ? ` <span class="tiny muted">${(ing.g/p.piece).toFixed(1).replace(".0","")} szt</span>` : "";
            const staly = ing.role==="staly";
            const tag = staly ? `<span class="tag l">stałe</span>`
                      : ing.role==="kotwica" ? `<span class="tag k">kotwica</span>` : "";
            const btn = e.eaten ? `<button class="lockbtn on" disabled title="Posiłek zjedzony — gramatury zamrożone">🔒</button>`
                      : staly ? `<button class="lockbtn" disabled title="Składnik stały — nigdy się nie zmienia">🔒</button>`
                              : `<button class="lockbtn ${ing.locked?"on":""}" data-lock="${iso}|${s.id}|${idx}"
                                   title="${ing.locked?"Zablokowane — kliknij, żeby zwolnić":"Zablokuj tę gramaturę"}"
                                   aria-pressed="${ing.locked?"true":"false"}">${ing.locked?"🔒":"🔓"}</button>`;
            const rm = e.eaten ? "" :
              `<button class="rmbtn" data-rming="${iso}|${s.id}|${idx}" title="Usuń składnik z tego posiłku">×</button>`;
            return `<li class="${ing.locked?"locked":""}"><span class="nm">${esc(p.name)}${unit}</span>${tag}
              <input type="number" data-g="${iso}|${s.id}|${idx}" value="${ing.g}" inputmode="numeric">
              ${btn}${rm}</li>`;
          }).join("")}</ul>
          ${e.eaten ? "" : `<div class="addrow">
            <select data-addsel="${iso}|${s.id}">
              <option value="">+ dodaj składnik…</option>
              ${S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"pl"))
                 .map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}
            </select>
            <button class="btn ghost sm" data-addbtn="${iso}|${s.id}">Dodaj</button>
          </div>`}
          <div class="lockbar">
            <span class="tiny muted">${e.eaten
              ? "Posiłek zjedzony — gramatury zamrożone. Możesz je poprawić na to, co faktycznie zjadłeś; reszta dnia się dopasuje."
              : `Kłódka trzyma gramaturę. Zmiana liczby blokuje automatycznie${hasPref?" i zapisuje ją na przyszłość":""}.`}</span>
            <span class="row" style="gap:6px">
              ${nLock?`<button class="btn ghost sm" data-unlockall="${iso}|${s.id}">Zwolnij wszystkie</button>`:""}
              ${hasPref?`<button class="btn ghost sm" data-forget="${e.recipeId}">Zapomnij gramatury</button>`:""}
            </span>
          </div>
        </details>
      </div>`;
    });
    html += `</div>`;
  }
  wrap.innerHTML = any ? html
    : `<div class="empty"><h3>Pusty tydzień</h3><p class="small">Wybierz dzień startu i naciśnij „Ułóż tydzień”.</p></div>`;

  wrap.querySelectorAll("details[data-key]").forEach(d=>{ if(open.has(d.dataset.key)) d.open = true; });
  if(open.size) window.scrollTo(0, scrollY);

  wrap.querySelectorAll("[data-rming]").forEach(b=> b.onclick=()=>{
    const [iso,s,idx]=b.dataset.rming.split("|"); rmIngFromPlan(iso,s,+idx); });
  wrap.querySelectorAll("[data-addbtn]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.addbtn.split("|");
    const sel = wrap.querySelector(`[data-addsel="${iso}|${s}"]`);
    if(!sel || !sel.value){ toast("Najpierw wybierz produkt z listy."); return; }
    addIngToPlan(iso, s, sel.value); });

  wrap.querySelectorAll("[data-copymeal]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.copymeal.split("|"); copyMeal(iso,s); });
  wrap.querySelectorAll("[data-pastemeal]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.pastemeal.split("|"); pasteMeal(iso,s); });
  wrap.querySelectorAll("[data-copyday]").forEach(b=> b.onclick=()=> copyDay(b.dataset.copyday));
  wrap.querySelectorAll("[data-pasteday]").forEach(b=> b.onclick=()=> pasteDay(b.dataset.pasteday));
  wrap.querySelectorAll("[data-forget]").forEach(b=> b.onclick=()=>{
    prefClear(b.dataset.forget); save(); renderWeek(); renderSettings();
    toast("Zapamiętane gramatury usunięte."); });

  wrap.querySelectorAll("[data-reroll]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.reroll.split("|"); rerollMeal(iso,s); });
  wrap.querySelectorAll("[data-eat]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.eat.split("|"); const e=S.plan[iso][s];
    e.eaten=!e.eaten;
    if(e.eaten){ const m=S.meals.find(x=>x.id===e.recipeId); logAdd(iso,s,m?m.name:"?","zjedzone"); }
    rebalance(iso); renderWeek(); renderBalance();
    toast(e.eaten ? "Zamrożone — reszta dnia dopasowana."
                  : "Odznaczone — solver znów może to ruszać."); });
  wrap.querySelectorAll("[data-g]").forEach(inp=> inp.onchange=()=>{
    const [iso,s,idx]=inp.dataset.g.split("|");
    const ing = S.plan[iso][s].ings[+idx];
    const nowa = Math.max(1, Math.round(+inp.value||1));
    if(nowa !== ing.g){
      ing.g = nowa; ing.base = nowa; ing.locked = true; ing.pref = true;
      if(ing.role!=="staly") prefSet(S.plan[iso][s].recipeId, ing.pid, nowa);
    }
    rebalance(iso); renderWeek(); renderBalance(); renderSettings();
    toast("Przeliczone — zapamiętane na przyszłość."); });
  wrap.querySelectorAll("[data-lock]").forEach(b=> b.onclick=()=>{
    const [iso,s,idx]=b.dataset.lock.split("|");
    const ing = S.plan[iso][s].ings[+idx];
    ing.locked = !ing.locked;
    rebalance(iso); renderWeek(); renderBalance();
    toast(ing.locked ? "Zablokowane — reszta dnia dopasowana."
                     : "Zwolnione — solver może to ruszać."); });
  wrap.querySelectorAll("[data-unlockall]").forEach(b=> b.onclick=()=>{
    const [iso,s]=b.dataset.unlockall.split("|");
    S.plan[iso][s].ings.forEach(i=> i.locked=false);
    rebalance(iso); renderWeek(); renderBalance();
    toast("Wszystkie kłódki zwolnione."); });
  renderBalance();
}

      piece:+document.getElementById("pPiece").value||null, pack:+document.getElementById("pPack").value||null};
    if(!v.name){ toast("Produkt potrzebuje nazwy."); return; }
    if(id) Object.assign(P(id), v); else S.products.push(Object.assign({id:uid(),excluded:false,source:"własne"}, v));
    save(); closeSheet(); renderProducts(); toast("Zapisane.");
  };
  if(id) document.getElementById("pDel").onclick = ()=>{
    if(S.meals.some(m=>m.ings.some(i=>i.pid===id)) && !confirm("Produkt jest w przepisach. Usunąć?")) return;
    S.products = S.products.filter(x=>x.id!==id); save(); closeSheet(); renderProducts();
  };
}

    return `<h3>${id?"Edytuj danie":"Nowe danie"}</h3>

      <label class="fld"><span>Ocena</span><input type="number" min="1" max="5" id="mRate" value="${d.rating}"></label>
      <label class="fld"><span>Czas (min)</span><input type="number" id="mTime" value="${d.time||20}"></label>
    </div>
    <div class="eyebrow">Składniki</div>
    <p class="tiny muted" style="margin:4px 0 8px">Kotwica trzyma gramaturę (mięso, jajka, ryż, całe opakowanie). Bufor przelicza się swobodnie. Stałe nigdy się nie zmienia.</p>
    ${d.ings.map((i,idx)=>{ const p=P(i.pid);
      return `<div class="item"><div style="flex:1">
        <div class="t small">${p?esc(p.name):"—"}</div>
        <div class="row" style="gap:6px;margin-top:4px">
          <select data-role="${idx}" style="width:auto;padding:4px 6px;font-size:12px">
            ${ROLES.map(r=>`<option value="${r[0]}" ${i.role===r[0]?"selected":""}>${r[1]}</option>`).join("")}</select>
          <input type="number" data-min="${idx}" value="${i.min??""}" placeholder="min" style="width:64px;padding:4px 6px;font-size:12px">
          <input type="number" data-max="${idx}" value="${i.max??""}" placeholder="max" style="width:64px;padding:4px 6px;font-size:12px">
        </div></div>
        <input type="number" data-g="${idx}" value="${i.g}" style="width:76px;text-align:right">
        <button class="btn ghost sm" data-rm="${idx}">×</button></div>`;}).join("")}
    <div class="row" style="gap:8px;margin-top:10px">
      <select id="addPid" style="flex:1">${S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,"pl")).map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button class="btn ghost sm" id="addIng">Dodaj</button>
    </div>
    <p class="small num" style="margin:12px 0 4px"><b>${Math.round(mm.kcal)} kcal</b> · B ${Math.round(mm.prot)} · W ${Math.round(mm.carb)} · T ${Math.round(mm.fat)}</p>
    <div class="row" style="gap:8px;margin-top:8px">
      <button class="btn primary" id="mSave" style="flex:1">Zapisz</button>
      ${id?`<button class="btn ghost" id="mDel">Usuń</button>`:""}
      <button class="btn ghost" id="mCancel">Anuluj</button>
    </div>`;
  };
  const bind = ()=>{
    document.getElementById("sheetInner").innerHTML = body();
    const grab = ()=>{ d.name=document.getElementById("mName").value; d.slot=document.getElementById("mSlot").value;
      d.rating=Math.min(5,Math.max(1,+document.getElementById("mRate").value||3));
      d.time=+document.getElementById("mTime").value||20; };
    document.querySelectorAll("[data-g]").forEach(i=> i.onchange=()=>{ grab(); d.ings[+i.dataset.g].g=Math.max(1,+i.value||1); bind(); });
    document.querySelectorAll("[data-role]").forEach(i=> i.onchange=()=>{ grab(); d.ings[+i.dataset.role].role=i.value; bind(); });
    document.querySelectorAll("[data-min]").forEach(i=> i.onchange=()=>{ grab(); d.ings[+i.dataset.min].min=+i.value||null; });
    document.querySelectorAll("[data-max]").forEach(i=> i.onchange=()=>{ grab(); d.ings[+i.dataset.max].max=+i.value||null; });
    document.querySelectorAll("[data-rm]").forEach(b=> b.onclick=()=>{ grab(); d.ings.splice(+b.dataset.rm,1); bind(); });
    document.getElementById("addIng").onclick = ()=>{ grab();
      d.ings.push({pid:document.getElementById("addPid").value, g:100, role:"bufor", min:null, max:null}); bind(); };

function scanSheet(){

      <button class="btn primary sm" id="scCam">Kod kreskowy</button>

    </div>

    <input type="file" id="scFile" accept="image/*" capture="environment" style="display:none">
    <button class="btn ghost" id="scClose" style="width:100%;margin-top:14px">Zamknij</button>`);
  document.getElementById("scClose").onclick = ()=>{ stopCam(); closeSheet(); };

let camStream=null, camTimer=null;
function stopCam(){ if(camTimer) clearInterval(camTimer); camTimer=null;
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
async function startCam(){
  const area = document.getElementById("scArea");
  if(!("BarcodeDetector" in window)){
    area.innerHTML = `<p class="small">Ta przeglądarka nie czyta kodów. Użyj „Wpisz kod” albo zdjęcia etykiety.</p>`;
    return;
  }
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    area.innerHTML = `<video id="scVid" playsinline autoplay muted></video><p class="tiny muted">Skieruj na kod kreskowy.</p>`;
    const v = document.getElementById("scVid"); v.srcObject = camStream; await v.play();
    const det = new BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e"]});
    camTimer = setInterval(async ()=>{
      try{ const codes = await det.detect(v);
        if(codes.length){ stopCam(); offLookup(codes[0].rawValue); } }catch(e){}
    }, 400);
  }catch(e){ area.innerHTML = `<p class="small">Brak dostępu do aparatu. Użyj zdjęcia etykiety.</p>`; }
}
async function offLookup(code){
  const area = document.getElementById("scArea");
  if(area) area.innerHTML = `<p class="small"><span class="spin"></span>Szukam ${esc(code)}…</p>`;
  try{
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,quantity`);
    const d = await r.json();
    const p = d.product; if(!p) throw 0;
    const n = p.nutriments||{};
    const kcal = Math.round(n["energy-kcal_100g"] ?? (n.energy_100g ? n.energy_100g/4.184 : 0));
    if(!kcal) throw 0;
    closeSheet();
    prodSheet(null, {name:(p.product_name||"produkt")+(p.brands?` (${p.brands.split(",")[0].trim()})`:""),
      kcal, prot:r1(n.proteins_100g), carb:r1(n.carbohydrates_100g), fat:r1(n.fat_100g),
      pack:(String(p.quantity||"").match(/(\d+)\s*g/)||[])[1] || null});
    toast("Sprawdź wartości i zapisz.");
  }catch(e){
    if(area) area.innerHTML = `<p class="small">Nie ma tego kodu w bazie. Zrób zdjęcie etykiety — Claude ją odczyta.</p>`;
  }
}
function readLabel(file){
  const area = document.getElementById("scArea");
  if(!S.ai.url){ if(area) area.innerHTML=`<p class="small">Najpierw podłącz AI w Ustawieniach.</p>`; return; }
  if(area) area.innerHTML = `<p class="small"><span class="spin"></span>Claude czyta etykietę…</p>`;
  const rd = new FileReader();
  rd.onload = async ()=>{
    try{
      const b64 = rd.result.split(",")[1];
      const mime = (file.type && file.type.startsWith("image/")) ? file.type : "image/jpeg";
      const p = await aiLabel(b64, mime);
      closeSheet();
      prodSheet(null, {name:p.name||"", kcal:Math.round(p.kcal||0), prot:r1(p.prot), carb:r1(p.carb),
                       fat:r1(p.fat), cat:CATS.includes(p.cat)?p.cat:"inne", piece:p.piece||null, pack:p.pack||null});
      toast("Odczytane — sprawdź i zapisz.");
    }catch(e){ if(area) area.innerHTML = `<p class="small">Nie udało się odczytać (${esc(e.message||"błąd")}). Spróbuj ostrzejszego zdjęcia albo wpisz ręcznie.</p>`; }
  };
  rd.readAsDataURL(file);
}

function renderShopSelectors(){
  const from=document.getElementById("shopFrom"), to=document.getElementById("shopTo");
  const days = Object.keys(S.plan).sort();
  if(!days.length){ from.innerHTML = to.innerHTML = `<option value="">brak planu</option>`; return; }
  const opts = days.map(d=>`<option value="${d}">${plDay(d)}</option>`).join("");
  const fv=from.value, tv=to.value;
  from.innerHTML=opts; to.innerHTML=opts;
  from.value = days.includes(fv)?fv:days[0];
  to.value   = days.includes(tv)?tv:days[Math.min(6,days.length-1)];
}
function buildShopping(){
  const from=document.getElementById("shopFrom").value, to=document.getElementById("shopTo").value;
  const wrap=document.getElementById("shopList");
  if(!from||!to){ wrap.innerHTML=`<div class="empty"><p>Najpierw ułóż tydzień.</p></div>`; return; }
  const tot={};
  Object.keys(S.plan).filter(d=>d>=from&&d<=to).forEach(d=>{
    dayIngs(S.plan[d]).forEach(i=> tot[i.pid]=(tot[i.pid]||0)+i.g); });
  let html="";
  CATS.forEach(c=>{
    const rows = Object.keys(tot).map(id=>P(id)).filter(p=>p&&p.cat===c);
    if(!rows.length) return;
    html += `<div class="card"><div class="eyebrow">${c}</div><div style="margin-top:6px">`;
    rows.sort((a,b)=>a.name.localeCompare(b.name,"pl")).forEach(p=>{
      const g=Math.round(tot[p.id]);
      let amount = g>=1000 ? (g/1000).toFixed(2)+" kg" : g+" g";
      if(p.pack) amount = `${Math.ceil(g/p.pack)} × opak. (${amount})`;
      else if(p.piece) amount = `${Math.ceil(g/p.piece)} szt (${amount})`;
      const done=!!S.shopChecked[p.id];
      html += `<div class="item ${done?"done":""}">
        <label class="row" style="gap:10px;flex:1"><input type="checkbox" class="chk" data-shop="${p.id}" ${done?"checked":""}>
          <span class="t">${esc(p.name)}</span></label>
        <span class="num small">${amount}</span></div>`;
    });
    html += `</div></div>`;
  });
  wrap.innerHTML = html || `<div class="empty"><p>Nic do kupienia w tym zakresie.</p></div>`;
  wrap.querySelectorAll("[data-shop]").forEach(cb=> cb.onchange=()=>{
    S.shopChecked[cb.dataset.shop]=cb.checked; save(); buildShopping(); });
}

function renderSettings(){
  const g=id=>document.getElementById(id);
  g("sKcal").value=S.settings.kcal; g("sProt").value=S.settings.prot; g("sFat").value=S.settings.fat;
  g("sCarb").value=targetCarb();
  g("sB").value=S.settings.split.b; g("sL").value=S.settings.split.l; g("sD").value=S.settings.split.d;
  g("aiUrl").value=S.ai.url||""; g("aiSecret").value=S.ai.secret||"";
  const sum=S.settings.split.b+S.settings.split.l+S.settings.split.d;
  g("splitInfo").textContent = sum===100
    ? `Podział podpowiada, które dania pasują do której pory. Bilans i tak liczony jest na cały dzień.`
    : `Suma to ${sum}% — popraw, żeby wyszło 100%.`;
  let ok="pamięć działa";
  try{ localStorage.setItem("__t","1"); localStorage.removeItem("__t"); }catch(e){ ok="brak zapisu — dane znikną po zamknięciu"; }
  g("storeInfo").textContent = `Wersja aplikacji: ${APP_VER}
${S.products.length} produktów · ${S.meals.length} dań · ${Object.keys(S.plan).length} dni w planie · ${(S.log||[]).length} wpisów historii · ${ok}`;
  const pc = prefCount();
  const pb = g("btnForgetAll");
  if(pb){ pb.style.display = pc ? "" : "none"; pb.textContent = `Zapomnij gramatury (${pc})`; }
}
function bindSettings(){
  ["sKcal","sProt","sFat","sB","sL","sD"].forEach(id=>{
    document.getElementById(id).onchange = ()=>{
      const g=x=>+document.getElementById(x).value;
      S.settings.kcal=g("sKcal")||2400; S.settings.prot=g("sProt")||170; S.settings.fat=g("sFat")||75;
      S.settings.split={b:g("sB")||30,l:g("sL")||38,d:g("sD")||32};
      save(); renderSettings(); renderBalance(); };
  });
  ["aiUrl","aiSecret"].forEach(id=>{
    document.getElementById(id).onchange = ()=>{
      S.ai.url=document.getElementById("aiUrl").value.trim().replace(/\/$/,"");
      S.ai.secret=document.getElementById("aiSecret").value.trim(); save(); };
  });
  document.getElementById("btnAiTest").onclick = async ()=>{
    const st=document.getElementById("aiStatus");
    S.ai.url=document.getElementById("aiUrl").value.trim().replace(/\/$/,"");
    S.ai.secret=document.getElementById("aiSecret").value.trim(); save();
    st.innerHTML=`<span class="spin"></span>sprawdzam…`;
    try{ const t = await aiCall({model:"claude-sonnet-5", max_tokens:20, messages:[{role:"user",content:"Odpowiedz jednym słowem: działa"}]});
      st.textContent = "✓ "+t.trim().slice(0,40); st.style.color="var(--ok)";
    }catch(e){ st.textContent = "✗ "+(e.message||"błąd"); st.style.color="var(--alert)"; }
  };
  document.getElementById("btnExport").onclick = ()=>{
    const b=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
    const a=document.createElement("a"); a.href=URL.createObjectURL(b);
    a.download=`jadlospis-${todayISO()}.json`; a.click(); URL.revokeObjectURL(a.href);
  };
  document.getElementById("btnImport").onclick = ()=> document.getElementById("fileIn").click();
  document.getElementById("fileIn").onchange = e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload = ()=>{ try{
        const d=JSON.parse(r.result);
        if(d.pack){ const n=mergePack(d); renderAll(); toast(`Wczytane: ${n} dań.`); return; }
        if(!d.products||!d.meals) throw 0;
        S=d; S.ai=S.ai||{url:"",secret:""}; S.log=S.log||[]; save(); renderAll(); toast("Kopia wczytana.");
      }catch(err){ toast("To nie jest plik z tej aplikacji."); } };
    r.readAsText(f); e.target.value="";
  };
  document.getElementById("btnReset").onclick = ()=>{
    if(!confirm("Skasuje produkty, dania i plan. Na pewno?")) return;
    const ai=S.ai; S=emptyState(); S.ai=ai; save(); renderAll(); toast("Wyczyszczone.");
  };
}

function mergePack(d){
  const key = s=>String(s).toLowerCase().trim();
  const byName={}; S.products.forEach(p=>byName[key(p.name)]=p.id);
  (d.products||[]).forEach(p=>{
    if(byName[key(p.name)]) return;
    const id=uid();
    S.products.push({id, name:p.name, kcal:+p.kcal||0, prot:+p.prot||0, carb:+p.carb||0, fat:+p.fat||0,
      cat:CATS.includes(p.cat)?p.cat:"inne", piece:p.piece||null, pack:p.pack||null, excluded:false, source:"paczka"});
    byName[key(p.name)]=id;
  });
  const have=new Set(S.meals.map(m=>key(m.name)));
  let added=0;
  (d.meals||[]).forEach(m=>{
    if(have.has(key(m.name))) return;
    const ings=(m.ings||[]).map(i=>{
      const pid = byName[key(i.p!==undefined?i.p:i.name)];
      if(!pid || !(+i.g>0)) return null;
      const role = ["kotwica","bufor","staly"].includes(i.role)?i.role:"bufor";
      return {pid, g:+i.g, role,
        min: +i.min || (role==="staly" ? +i.g : (role==="kotwica" ? +i.g : Math.max(3,Math.round(i.g*0.4)))),
        max: +i.max || (role==="staly" ? +i.g : (role==="kotwica" ? +i.g : Math.min(600,Math.round(i.g*2.5))))};
    }).filter(Boolean);
    if(!ings.length) return;
    S.meals.push({id:uid(), name:m.name, slot:SLOTS.some(s=>s.id===m.slot)?m.slot:"l",
      rating:Math.min(5,Math.max(1,+m.rating||3)), time:+m.time||20, tags:m.tags||[], ings});
    have.add(key(m.name)); added++;
  });
  if(d.settings){
    const t=d.settings;
    if(t.kcal) S.settings.kcal=+t.kcal; if(t.prot) S.settings.prot=+t.prot; if(t.fat) S.settings.fat=+t.fat;
    if(t.split) S.settings.split=t.split; if(t.rules) S.settings.rules=t.rules;
  }
  save(); return added;
}

/* ---------- drobiazgi ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2600); }
function busy(on,msg){ const b=document.getElementById("btnGen");
  b.disabled=on; b.innerHTML = on ? `<span class="spin"></span>` : "Ułóż tydzień";
  if(on&&msg) toast(msg); }

const TITLES={week:"Tydzień",meals:"Posiłki",prod:"Produkty",shop:"Zakupy",set:"Ustawienia"};
function go(v){
  document.querySelectorAll(".view").forEach(s=>s.classList.toggle("on", s.id==="v-"+v));
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on", b.dataset.v===v));
  document.getElementById("hTitle").textContent=TITLES[v];
  if(v==="meals") renderMeals();
  if(v==="prod") renderProducts();
  if(v==="shop"){ renderShopSelectors(); buildShopping(); }
  if(v==="set") renderSettings();
  window.scrollTo(0,0);
}
function renderAll(){ renderWeek(); renderShopSelectors(); renderSettings(); }

if("serviceWorker" in navigator && location.protocol.startsWith("http"))
  navigator.serviceWorker.register("sw.js").catch(()=>{});
